<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manager Live Dashboard - Connected Mode</title>

  <!-- ================================================================= -->
  <!-- 🎨 SECTION 1: STYLES & VISUAL DESIGNS (<style>)                  -->
  <!-- Describes how everything looks (colors, fonts, cards, popups)    -->
  <!-- ================================================================= -->
  <style>
    /* ----------------------------------------------------------------- */
    /* 1A. General Setup & Color Theme Variables                         */
    /* ----------------------------------------------------------------- */
    :root {
      --bg-color: #1800ad;
      --card-open: #FAF9F6;
      --card-active: #2E7D32;
      --card-expiring: #E65100;
      --card-expired: #D32F2F;
      --text-main: #1800ad;
      --text-muted: #5A6B82;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
      margin: 0;
    }

    /* ----------------------------------------------------------------- */
    /* 1B. Dashboard Layout & Header Styles                              */
    /* ----------------------------------------------------------------- */
    .dashboard-container {
      background: #FAF9F6;
      border-radius: 20px;
      padding: 24px 16px;
      max-width: 420px;
      margin: 0 auto;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }
    h1 {
      font-size: 1.25rem;
      text-align: center;
      margin-top: 0;
      margin-bottom: 20px;
      background: #1800ad;
      color: #FAF9F6;
      padding: 12px;
      border-radius: 12px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; max-width: 380px; margin: 0 auto; }

    /* ----------------------------------------------------------------- */
    /* 1C. Table Card Styles & State Colors (Open, Active, Expired)      */
    /* ----------------------------------------------------------------- */
    .table-card {
      background: #FFFFFF;
      border-radius: 12px;
      padding: 14px 10px;
      text-align: center;
      border: 2px solid #E2E8F0;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      transition: transform 0.1s ease, background 0.3s ease;
      position: relative;
    }
    .table-card.clickable { cursor: pointer; }
    .table-card.clickable:active { transform: scale(0.96); }
    .table-card.state-open { background: #FFFFFF; border-color: #E2E8F0; opacity: 0.85; cursor: default; }
    .table-card.state-active { background: var(--card-active); color: #FFFFFF; border-color: #246527; }
    .table-card.state-expiring { background: var(--card-expiring); color: #FFFFFF; border-color: #b33f00; }
    .table-card.state-expired { background: var(--card-expired); color: #FFFFFF; border-color: #a82424; }
    .table-card.state-active .timer-display,
    .table-card.state-expiring .timer-display,
    .table-card.state-expired .timer-display { color: #FFEB3B; }
    .table-header { display: flex; justify-content: center; align-items: center; gap: 6px; }
    .table-num { font-size: 1.1rem; font-weight: 800; text-transform: uppercase; }
    .bill-emoji { font-size: 1rem; transition: filter 0.3s ease, opacity 0.3s ease; }
    .bill-faded { opacity: 0.3; filter: grayscale(100%); }
    .bill-approved { opacity: 1; filter: drop-shadow(0 0 4px #2E7D32); }
    .timer-display { font-size: 0.95rem; margin-top: 8px; color: var(--text-muted); font-weight: bold; font-family: monospace; }

    /* ----------------------------------------------------------------- */
    /* 1D. Details Modal (Popup Window) & Button Styles                  */
    /* ----------------------------------------------------------------- */
    .modal {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75); align-items: center; justify-content: center; padding: 20px; z-index: 1000;
    }
    .modal-content { background: #FAF9F6; color: #1800ad; padding: 24px; border-radius: 16px; max-width: 360px; width: 100%; }
   /* ----------------------------------------------------------------- */
    /* Updated Tactile Button & Press Effects                           */
    /* ----------------------------------------------------------------- */
    .btn-action {
      border: none; 
      padding: 12px 16px; 
      border-radius: 8px; 
      width: 100%; 
      margin-top: 12px;
      font-weight: bold; 
      cursor: pointer; 
      font-size: 0.95rem; 
      transition: all 0.1s ease-in-out;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      user-select: none;
    }
    .btn-action:hover {
      filter: brightness(1.05);
    }
    .btn-action:active {
      transform: translateY(2px) scale(0.97);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
    }
    .btn-test {
      background: #1800ad;
      color: #FAF9F6;
      border: 1px solid #1800ad;
    }
    .btn-pay { background: #E2E8F0; color: var(--text-muted); }
    .btn-pay.approved { background: #2E7D32; color: #FFFFFF; }
    .btn-close { background: #E2E8F0; color: #1800ad; }
    .verify-badge { display: inline-block; padding: 8px 12px; border-radius: 6px; font-size: 0.85rem; font-weight: bold; margin-top: 8px; text-align: center; width: 100%; box-sizing: border-box; }
    .verified { background: #2E7D32; color: #FFFFFF; }
    .unverified { background: #D32F2F; color: #FFFFFF; }

    /* ----------------------------------------------------------------- */
    /* 1E. PIN Screen & Sound Control Panel Styles                       */
    /* ----------------------------------------------------------------- */
    #pinOverlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg-color); z-index: 2000;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .pin-box { background: #FAF9F6; padding: 30px; border-radius: 16px; text-align: center; max-width: 300px; width: 100%; }
    .pin-input { font-size: 1.8rem; letter-spacing: 8px; text-align: center; width: 80%; padding: 10px; background: #FFFFFF; border: 2px solid #E2E8F0; color: #1800ad; border-radius: 8px; margin-bottom: 15px; }
    .pin-error { color: #D32F2F; font-size: 0.85rem; margin-top: 8px; display: none; }
    .audio-settings { display: none; margin-top: 15px; background: #FFFFFF; padding: 10px; border-radius: 10px; border: 1px solid #E2E8F0; font-size: 0.85rem; }
  </style>
</head>
<body>

  <!-- ================================================================= -->
  <!-- 🏗️ SECTION 2: PAGE STRUCTURE & HTML ELEMENTS                    -->
  <!-- Visual building blocks of the app layout                         -->
  <!-- ================================================================= -->

  <!-- ----------------------------------------------------------------- -->
  <!-- 2A. PIN Lock Screen Overlay                                       -->
  <!-- ----------------------------------------------------------------- -->
  <div id="pinOverlay">
    <div class="pin-box">
      <h2 style="margin-top:0; color:#1800ad; font-size: 1.2rem;">Manager Access</h2>
      <p style="color:var(--text-muted); font-size:0.9rem;">Enter 4-digit PIN code:</p>
      <input type="password" id="pinInput" maxlength="4" class="pin-input" pattern="\d*" inputmode="numeric">
      <div id="pinError" class="pin-error">Incorrect PIN. Try again.</div>
      <button class="btn-action btn-pay approved" onclick="verifyPin()" style="margin-top:8px;">Enter</button>
    </div>
  </div>

  <!-- ----------------------------------------------------------------- -->
  <!-- 2B. Main Dashboard Area & Audio Controls                         -->
  <!-- ----------------------------------------------------------------- -->
  <div class="dashboard-container">
    <h1>Counter Dashboard</h1>
    <div id="tableGrid" class="grid">Connecting...</div>

    <div class="audio-settings" id="audioSettingsPanel">
      <label style="display:flex; justify-content:space-between; font-weight:bold;">
        <span>Alert Volume</span>
        <span id="volVal">35</span>
      </label>
      <input type="range" id="volumeSlider" min="0" max="100" value="35" style="width:100%; margin-top:5px;" oninput="updateVolume(this.value)">
      <button class="btn-action btn-pay" style="margin-top: 8px; padding: 6px;" onclick="playAlertSound()">Test</button>
    </div>
  </div>

 <!-- ----------------------------------------------------------------- -->
  <!-- 2C. Order Details Modal (Popup Window)                            -->
  <!-- ----------------------------------------------------------------- -->
  <div id="detailsModal" class="modal">
    <div class="modal-content">
      <h2 id="modalTitle" style="margin-top:0;">Table X Details</h2>
      <hr style="border-color: #E2E8F0;">
      
      <!-- Component 1: Ordered Items -->
      <p style="margin-bottom: 4px;"><strong>1. Ordered Items:</strong></p>
      <ul id="modalOrders" style="padding-left: 20px; color: var(--text-muted); font-size: 0.95rem; margin-top: 4px;"></ul>

      <!-- Component 2: Focus Time -->
      <p style="margin-top: 12px; margin-bottom: 8px;"><strong>2. Session Duration:</strong></p>
      <div style="background: #E2E8F0; padding: 10px; border-radius: 8px; font-weight: bold; color: #1800ad; font-size: 0.9rem;">
        ⏱️ Focus time 45 min
      </div>

      <p style="margin-top: 16px;"><strong>Total Sum:</strong> <span id="modalTotal">0.00</span> DKK</p>
      
      <div id="modalVerify" class="verify-badge">Checking...</div>

      <button id="markPaidBtn" class="btn-action btn-pay" onclick="togglePaymentStatus()">Mark as Paid</button>
      <button class="btn-action btn-close" onclick="closeModal()">Close</button>
    </div>
  </div>

  <!-- ================================================================= -->
  <!-- ⚙️ SECTION 3: APPLICATION LOGIC (<script>)                       -->
  <!-- How the app works, connects to database, handles clicks & timers  -->
  <!-- ================================================================= -->
  <script>
    /* ----------------------------------------------------------------- */
    /* 3A. Key Settings & Global Variables                               */
    /* ----------------------------------------------------------------- */
    const MANAGER_PIN = "0070"; 
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxjQtbuew_onZqKqSEO49KeMQwIwm-t5VBwwSC1l8XcBE-7bWcjcnUDS4Jv9lNHgC2HbQ/exec"; 

    let activeData = {};
    let currentSelectedTable = null;
    let pollInterval = null;
    let audioCtx = null;
    let alertVolume = 0.35; 

    /* ----------------------------------------------------------------- */
    /* 3B. Audio Functions (Volume & Sound Alerts)                       */
    /* ----------------------------------------------------------------- */
    function updateVolume(val) {
      document.getElementById('volVal').innerText = val;
      alertVolume = val / 100;
    }

    function playAlertSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        
        const now = audioCtx.currentTime;
        [587.33, 880].forEach((freq, index) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + (index * 0.1));
          gain.gain.setValueAtTime(alertVolume, now + (index * 0.1));
          gain.gain.exponentialRampToValueAtTime(0.001, now + (index * 0.1) + 0.5);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + (index * 0.1));
          osc.stop(now + (index * 0.1) + 0.5);
        });
      } catch (e) { console.warn("Audio error:", e); }
    }

    /* ----------------------------------------------------------------- */
    /* 3C. Security & PIN Access Handling                                */
    /* ----------------------------------------------------------------- */
    window.addEventListener('DOMContentLoaded', () => {
      const pinInput = document.getElementById('pinInput');
      pinInput.focus();
      pinInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') verifyPin(); });
    });

    function verifyPin() {
      if (document.getElementById('pinInput').value === MANAGER_PIN) {
        document.getElementById('pinOverlay').style.display = 'none';
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        fetchDashboardData(); 
        pollInterval = setInterval(fetchDashboardData, 10000); 
      } else {
        document.getElementById('pinError').style.display = 'block';
        document.getElementById('pinInput').value = '';
      }
    }

    /* ----------------------------------------------------------------- */
    /* 3D. Server Data Syncing (Fetching Latest Info)                    */
    /* ----------------------------------------------------------------- */
    async function fetchDashboardData() {
      if (!APPS_SCRIPT_URL) return;

      try {
        const response = await fetch(`${APPS_SCRIPT_URL}?action=manager`);
        const result = await response.json();
        
        if (result.status === "success" && result.tables) {
          let hasNewActiveTable = false;

          Object.keys(result.tables).forEach(tNum => {
            const incoming = result.tables[tNum];
            incoming.secondsLeft = parseEndTimeToSeconds(incoming.endTime);

            const oldTable = activeData[tNum];
            const oldStatus = oldTable ? oldTable.status.toLowerCase() : 'open';
            const newStatus = incoming.status.toLowerCase();
            
            // Retain local paid status during active/expiring/expired cycles
            if (newStatus !== 'open' && oldTable && oldTable.isPaid) {
              incoming.isPaid = true;
            } else if (newStatus === 'open') {
              incoming.isPaid = false; // Reset once back to open
            }

            if (oldStatus === 'open' && (newStatus === 'active' || newStatus === 'expiring')) {
              hasNewActiveTable = true;
            }
          });

          activeData = result.tables;
          renderGrid();

          document.getElementById('audioSettingsPanel').style.display = 'block';
          if (hasNewActiveTable) playAlertSound();
          if (currentSelectedTable && activeData[currentSelectedTable]) updateModalContent(currentSelectedTable);
        }
      } catch (err) {
        console.error("Failed to fetch live data:", err);
      }
    }

    function parseEndTimeToSeconds(rawEnd) {
      if (!rawEnd) return 0;
      const now = Date.now();
      const endDateMs = new Date(rawEnd).getTime();
      if (!isNaN(endDateMs)) {
        const diffSec = Math.floor((endDateMs - now) / 1000);
        return diffSec > 0 ? diffSec : 0;
      }
      return 0;
    }

    /* ----------------------------------------------------------------- */
    /* 3E. Grid UI Rendering & Live Timer Updates                        */
    /* ----------------------------------------------------------------- */
    function renderGrid() {
      const grid = document.getElementById('tableGrid');
      grid.innerHTML = '';
      const sortedKeys = Object.keys(activeData).sort((a, b) => parseInt(a) - parseInt(b));

      sortedKeys.forEach(tNum => {
        const t = activeData[tNum];
        let statusLower = t.status.toLowerCase();

        if (statusLower !== 'open') {
          if (t.secondsLeft <= 0) statusLower = 'expired';
          else if (t.secondsLeft <= 300) statusLower = 'expiring'; 
          else statusLower = 'active';
        }

        const card = document.createElement('div');
        const isOpen = statusLower === 'open';
        card.className = `table-card state-${statusLower}`;

        if (!isOpen) {
          card.className += ' clickable';
          card.onclick = () => openModal(tNum);
        }

        const isPaid = t.isPaid;
        const billClass = isPaid ? 'bill-approved' : 'bill-faded';
        
        let timerText = isOpen ? "Available" : (t.secondsLeft <= 0 ? "00:00" : `${Math.floor(t.secondsLeft/60).toString().padStart(2,'0')}:${(t.secondsLeft%60).toString().padStart(2,'0')}`);

        card.innerHTML = `
          <div class="table-header">
            <span class="table-num">Table ${t.table}</span>
            ${!isOpen ? `<span class="bill-emoji ${billClass}">💵</span>` : ''}
          </div>
          <div class="timer-display" id="timer-${tNum}">${timerText}</div>
        `;
        grid.appendChild(card);
      });
    }

    // Every second count down timer tick
    setInterval(() => {
      Object.keys(activeData).forEach(tNum => {
        const t = activeData[tNum];
        if (t.status.toLowerCase() !== 'open' && t.secondsLeft > 0) {
          t.secondsLeft--;
          const timerEl = document.getElementById(`timer-${tNum}`);
          if (timerEl) {
            timerEl.innerText = `${Math.floor(t.secondsLeft/60).toString().padStart(2,'0')}:${(t.secondsLeft%60).toString().padStart(2,'0')}`;
          }
        }
      });
    }, 1000);

    /* ----------------------------------------------------------------- */
    /* 3F. Table Details Popup Window Actions                            */
    /* ----------------------------------------------------------------- */
    function openModal(tNum) {
      currentSelectedTable = tNum;
      updateModalContent(tNum);
      document.getElementById('detailsModal').style.display = 'flex';
    }

   function updateModalContent(tNum) {
      const t = activeData[tNum];
      if (!t) return;

      document.getElementById('modalTitle').innerText = `Table ${t.table} Details`;
      
      // Component 1: Items Ordered
      const ordersList = document.getElementById('modalOrders');
      ordersList.innerHTML = (t.orders && t.orders.length > 0) 
        ? t.orders.map(item => `<li>${item}</li>`).join('') 
        : '<li>No items recorded</li>';
        
      document.getElementById('modalTotal').innerText = Number(t.totalSum || 0).toFixed(2);

      const verifyEl = document.getElementById('modalVerify');
      if (t.intervalCount > 0) {
        verifyEl.innerText = "Focus pass verified";
        verifyEl.className = "verify-badge verified";
      } else {
        verifyEl.innerText = "Focus pass not verified";
        verifyEl.className = "verify-badge unverified";
      }
      updateModalPaidBtn();
    }

    function updateModalPaidBtn() {
      const btn = document.getElementById('markPaidBtn');
      if (!currentSelectedTable || !activeData[currentSelectedTable]) return;

      const t = activeData[currentSelectedTable];
      btn.style.display = t.status.toLowerCase() === 'open' ? 'none' : 'block';

      if (t.isPaid) {
        btn.innerText = "✓ Paid & Approved";
        btn.className = "btn-action btn-pay approved";
      } else {
        btn.innerText = "Mark as Paid";
        btn.className = "btn-action btn-pay";
      }
    }

    /* ----------------------------------------------------------------- */
    /* 3G. Payment Status & Modal Controls                               */
    /* ----------------------------------------------------------------- */
    function togglePaymentStatus() {
      if (!currentSelectedTable || !activeData[currentSelectedTable]) return;

      const t = activeData[currentSelectedTable];
      t.isPaid = !t.isPaid;
      updateModalPaidBtn();
      renderGrid();

      try {
        fetch(`${APPS_SCRIPT_URL}?action=togglePaid&table=${currentSelectedTable}`, { mode: 'no-cors' });
      } catch (err) {
        console.warn("Payment status sync error:", err);
      }
    }

    function closeModal() {
      document.getElementById('detailsModal').style.display = 'none';
      currentSelectedTable = null;
    }
  </script>
</body>
</html>
